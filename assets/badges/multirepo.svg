<svg xmlns="http://www.w3.org/2000/svg" width="114" height="28" aria-label="MULTIREPO">
    <title>MULTIREPO</title>
    <rect rx="3" ry="3" width="114" height="28" fill="#2e4a3e" shape-rendering="crispEdges" />
    <g fill="none" stroke="#fff" stroke-width="1.1" text-anchor="middle"
        font-family="Verdana,Geneva,DejaVu Sans,sans-serif"
        text-rendering="geometricPrecision" font-size="100">
        <!-- Three separate outlined boxes in triangle = multiple distinct repos -->
        <rect x="9.5" y="8" width="5" height="5" rx=".9" />
        <rect x="17.5" y="8" width="5" height="5" rx=".9" />
        <rect x="13.5" y="15" width="5" height="5" rx=".9" />
        <text transform="scale(.1)" x="685" y="175" textLength="800" font-weight="bold" fill="#fff"
            stroke="none">MULTIREPO</text>
    </g>
</svg>